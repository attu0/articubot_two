ekf_filter_node:
  ros__parameters:
    use_sim_time: false        # CHANGED: physical robot, no /clock topic
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false, # vx only, no vy on diff drive
                   false, false, true,  # vyaw
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    imu0: /imu/data             # filtered topic from imu_filter_madgwick, not /imu/data_raw
    imu0_config: [false, false, false,  # x, y, z
                  false, false, true,   # roll, pitch, yaw (yaw only)
                  false, false, false,  # vx, vy, vz
                  false, false, true,   # vroll, vpitch, vyaw
                  true,  false, false]  # ax, ay, az (ax only)
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
